/* ─── Audio ─────────────────────────────────────────────── */
const AC = new (window.AudioContext || window.webkitAudioContext)();
function beep(freq, freq2, dur, type='sine', vol=0.25) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.connect(g); g.connect(AC.destination);
  o.frequency.setValueAtTime(freq, AC.currentTime);
  if(freq2) o.frequency.exponentialRampToValueAtTime(freq2, AC.currentTime + dur);
  g.gain.setValueAtTime(vol, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
  o.start(); o.stop(AC.currentTime + dur);
}
const SFX = {
  jump:  () => beep(280, 560, 0.18, 'sine', 0.3),
  shoot: () => beep(900, 220, 0.14, 'square', 0.18),
  hit:   () => beep(250, 80,  0.22, 'sawtooth', 0.3),
  die:   () => beep(440, 55,  0.55, 'sawtooth', 0.35),
  coin:  () => beep(550, 800, 0.12, 'sine', 0.2),
  power: () => { beep(330,660,0.16,'square',0.18); setTimeout(()=>beep(880,1320,0.12,'square',0.14),100); },

/* ─── AABB helpers ───────────────────────────────────────── */
function overlap(a,b){
  return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;
}
function resolveAABB(obj, p) {
  const ox = Math.min(obj.x+obj.w,p.x+p.w)-Math.max(obj.x,p.x);
  const oy = Math.min(obj.y+obj.h,p.y+p.h)-Math.max(obj.y,p.y);
  if(ox<oy) {
    obj.vx=0;
    obj.x = obj.x<p.x ? p.x-obj.w : p.x+p.w;
  } else {
    if(obj.y<p.y){ obj.y=p.y-obj.h; obj.vy=0; obj.onGround=true; }
    else          { obj.y=p.y+p.h;  obj.vy=0; }
  }
}

/* Draw pixel-art dog at (0,0), facing right */
function dogSprite(gliding, af, inv) {
  if(inv>0 && (inv%6)<3) return; // invincibility flash

  // tail
  ctx.fillStyle='#8b5a2b';
  ctx.fillRect(-7,15,7,5);
  ctx.fillRect(-11,11,5,5);

  // body
  ctx.fillStyle='#b87333';
  ctx.fillRect(3,10,21,18);

  // chest / belly
  ctx.fillStyle='#e8c08d';
  ctx.fillRect(6,14,10,12);

  // cape while gliding (keeps the original glide mechanic visible)
  if(gliding) {
    ctx.fillStyle='#d62828';
    ctx.fillRect(-5,10,9,4);
    ctx.fillRect(-9,14,13,4);
    ctx.fillRect(-12,18,16,4);
  }

  // head
  ctx.fillStyle='#b87333';
  ctx.fillRect(7,0,16,14);

  // floppy ear
  ctx.fillStyle='#6f451f';
  ctx.fillRect(5,1,5,11);
  ctx.fillRect(3,7,5,7);

  // muzzle
  ctx.fillStyle='#e8c08d';
  ctx.fillRect(18,6,10,7);

  // nose
  ctx.fillStyle='#1f1f1f';
  ctx.fillRect(25,7,4,4);

  // eye
  ctx.fillStyle='#ffffff';
  ctx.fillRect(15,3,5,5);
  ctx.fillStyle='#111111';
  ctx.fillRect(17,4,2,3);

  // collar
  ctx.fillStyle='#2471a3';
  ctx.fillRect(6,12,18,3);
  ctx.fillStyle='#f4d03f';
  ctx.fillRect(14,14,4,4);

  // animated legs
  ctx.fillStyle='#8b5a2b';
  if(af===0){
    ctx.fillRect(5,27,6,8); ctx.fillRect(17,27,6,8);
    ctx.fillRect(3,33,9,4); ctx.fillRect(16,33,9,4);
  } else {
    ctx.fillRect(5,27,6,10); ctx.fillRect(17,27,6,6);
    ctx.fillRect(3,35,9,4); ctx.fillRect(16,31,9,4);
  }
}

/* Draw single coral platform */
function drawPlat(p) {
  const px = p.x-camX, py = p.y;
  if(px+p.w<0||px>W) return;
  // base
  ctx.fillStyle='#a93226'; ctx.fillRect(px,py,p.w,p.h);
  ctx.fillStyle='#c0392b'; ctx.fillRect(px,py,p.w,p.h>20?4:3);
  // texture stripes
  ctx.fillStyle='#e74c3c';
  for(let i=0;i<p.w;i+=18){ctx.fillRect(px+i,py,9,3);}
  // top bumps/spikes
  if(p.h>=40) {
    ctx.fillStyle='#e74c3c';
    for(let i=10;i<p.w-10;i+=22){
      ctx.fillRect(px+i,py-9,13,12); ctx.fillRect(px+i+3,py-15,7,9);
      ctx.fillRect(px+i+5,py-19,4,6);
    }
    ctx.fillStyle='#7b241c'; ctx.fillRect(px,py+p.h-7,p.w,7);
  } else {
    ctx.fillStyle='#e74c3c';
    for(let i=5;i<p.w-5;i+=16){
      ctx.fillRect(px+i,py-7,7,9); ctx.fillRect(px+i+2,py-12,4,7);
    }
  }
  ctx.fillStyle='#f15a4a'; ctx.fillRect(px,py,p.w,2);
}

/* Draw bone projectile */
function drawBullet(b) {
  const bx = b.x-camX, by = b.y;
  if(b.type==='laser'){
    ctx.fillStyle='#00e5ff';ctx.fillRect(bx,by+4,30,5);
    ctx.fillStyle='#d9ffff';ctx.fillRect(bx+4,by+5,20,2);
  } else if(b.type==='fire'){
    ctx.fillStyle='#ff3d00';ctx.fillRect(bx+3,by+2,16,12);
    ctx.fillStyle='#ffb300';ctx.fillRect(bx,by+5,12,6);
    ctx.fillStyle='#fff3b0';ctx.fillRect(bx+8,by+5,6,5);
  } else if(b.type==='spread'){
    ctx.fillStyle='#c77dff';ctx.fillRect(bx+2,by+3,18,7);
    ctx.fillStyle='#f3d9ff';ctx.fillRect(bx+6,by+5,10,3);
  } else {
    ctx.fillStyle='#f5f1df';
    ctx.fillRect(bx+7,by+4,22,6);
    ctx.fillRect(bx+3,by+2,7,5); ctx.fillRect(bx+3,by+7,7,5);
    ctx.fillRect(bx+27,by+2,7,5); ctx.fillRect(bx+27,by+7,7,5);
    ctx.fillStyle='#d8d1b7'; ctx.fillRect(bx+9,by+6,18,2);
  }
}

/* Draw coin projectile */
function drawECoin(c) {
  const cx=c.x-camX, cy=c.y;
  if(c.type==='bubble'){
    ctx.fillStyle='rgba(90,180,224,.35)';ctx.strokeStyle='#7ec8e3';
    ctx.beginPath();ctx.arc(cx+6,cy+6,6,0,Math.PI*2);ctx.fill();ctx.stroke();
  } else if(c.type==='shell'){
    ctx.fillStyle='#e74c3c';ctx.fillRect(cx,cy+2,12,8);
    ctx.fillStyle='#922b21';ctx.fillRect(cx+3,cy,6,12);
  } else {
    ctx.fillStyle='#f1c40f'; ctx.fillRect(cx,cy,10,10);
    ctx.fillStyle='#d4ac0d'; ctx.fillRect(cx+2,cy+1,6,8);
    ctx.fillStyle='#f7dc6f'; ctx.fillRect(cx+3,cy+2,3,3);
  }
}

/* Draw goal flag */
function drawGoal() {
  const gx=GOAL.x-camX, gy=GOAL.y;
  if(gx<-60||gx>W+60) return;
  ctx.fillStyle='#aaa'; ctx.fillRect(gx+12,gy-22,4,GOAL.h+22);
  ctx.fillStyle='#e74c3c'; ctx.fillRect(gx+16,gy-22,32,22);
  ctx.fillStyle='#fff'; ctx.font='bold 8px monospace'; ctx.textAlign='left';
  ctx.fillText('WIN!',gx+19,gy-8);
  ctx.fillStyle='#888'; ctx.fillRect(gx+4,gy+GOAL.h,24,8);
}

/* Draw ocean background */
function drawBG() {
  // sky→deep gradient
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#06082a'); g.addColorStop(0.55,'#0b1e55');
  g.addColorStop(1,'#071e0e');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // light rays
  ctx.save(); ctx.globalAlpha=0.04; ctx.fillStyle='#3a80d0';
  for(let i=0;i<6;i++){
    const rx=((i*170+frame*0.15)%900)-100;
    ctx.beginPath();
    ctx.moveTo(rx,0); ctx.lineTo(rx+80,H); ctx.lineTo(rx-30,H);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // far seaweed silhouettes
  ctx.fillStyle='#0b2e38';
  for(let i=0;i<22;i++){
    const bx=((i*165-camX*0.18)%W+W)%W;
    const bh=38+(i%5)*18;
    ctx.fillRect(bx,H-bh,10,bh); ctx.fillRect(bx+3,H-bh-12,5,14);
  }
}

/* Draw HUD */
function drawHUD() {
  ctx.fillStyle='rgba(0,0,10,0.72)'; ctx.fillRect(0,0,W,46);
  ctx.textAlign='left'; ctx.font='bold 14px monospace';
  ctx.fillStyle='#2ecc40'; ctx.fillText('❤ '+lives,10,20);
  ctx.fillStyle='#f1c40f'; ctx.fillText('SCORE '+score,90,20);
  ctx.fillStyle='#e74c3c'; ctx.fillText('ENEMIES '+enemies.filter(e=>!e.dead).length,235,20);
  ctx.fillStyle=player.hasBlaster?ammoColor(player.weaponType):'#aaa';
  const wname=player.hasBlaster?ammoLabel(player.weaponType):'BONE';
  ctx.fillText('WEAPON '+wname,390,20);
  ctx.fillStyle='#fff';ctx.fillText('AMMO '+(player.hasBlaster?player.ammo:'∞'),570,20);
  ctx.fillStyle='#7f8c8d';ctx.font='9px monospace';
  ctx.fillText('A/D or arrows = move   SPACE = jump/glide   Z = shoot   R = restart',10,38);

  if(boss.active&&!boss.dead){
    const bw=260,bx=W/2-bw/2,by=52;
    ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(bx-3,by-3,bw+6,18);
    ctx.fillStyle='#501313';ctx.fillRect(bx,by,bw,12);
    ctx.fillStyle='#f1c40f';ctx.fillRect(bx,by,bw*(boss.hp/boss.maxHp),12);
    ctx.fillStyle='#fff';ctx.font='bold 10px monospace';ctx.textAlign='center';
    ctx.fillText('QUEEN BEE  '+Math.max(0,boss.hp)+' / '+boss.maxHp,W/2,by+10);
    ctx.textAlign='left';
  }
}

/* ─────────────────────────────────────────────────────────── *
 *  UPDATE                                                     *
 * ─────────────────────────────────────────────────────────── */
function update() {
  if(GS!=='play') return;
  frame++;

  /* bubbles */
  bubbles.forEach(b=>{
    b.y-=b.sp;
    if(b.y+b.r<0){ b.y=H+b.r; b.wx=Math.random()*LW; }
  });

  /* particles */
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.18; p.life--;
    if(p.life<=0) parts.splice(i,1);
  }

  /* player dead animation */
  if(player.dead){
    player.vy+=G; player.y+=player.vy; player.dieT--;
    if(player.dieT<=0){
      if(lives<=0){ GS='over'; return; }
      player.x=Math.max(camX+60,80); player.y=80;
      player.vx=0; player.vy=0; player.dead=false;
      player.inv=160; player.gliding=false;
    }
    return;
  }

  /* ── player input ── */
  const L=K['KeyA']||K['ArrowLeft'];
  const R=K['KeyD']||K['ArrowRight'];
  const SP=K['Space'];
  const ZZ=K['KeyZ'];

  if(L){ player.vx-=0.85; player.dir=-1; }
  if(R){ player.vx+=0.85; player.dir= 1; }
  if(!L&&!R) player.vx*=0.78;
  player.vx=Math.max(-6.5,Math.min(6.5,player.vx));

  /* jump - only on fresh press */
  if(SP && player.onGround && spaceWasUp){
    player.vy=-11.5; player.onGround=false;
    player.jumpHeld=true; spaceWasUp=false;
    SFX.jump();
  }
  if(!SP) spaceWasUp=true;

  /* glide - hold space while falling */
  player.gliding = SP && !player.onGround && player.vy>1;
  if(player.gliding) player.vy=Math.min(player.vy, 1.4);

  /* gravity */
  if(!player.gliding) player.vy+=G;
  if(player.vy>MFALL) player.vy=MFALL;

  player.x+=player.vx; player.y+=player.vy;
  if(player.x<0){player.x=0; player.vx=0;}
  if(player.x+player.w>LW){player.x=LW-player.w; player.vx=0;}

  /* platform collision */
  player.onGround=false;
  PLATS.forEach(p=>{ if(overlap(player,p)) resolveAABB(player,p); });

  /* fall kill */
  if(player.y>H+60) hitPlayer(true);

  /* animate */
  if(++player.at>=10){ player.at=0; player.af=1-player.af; }
  if(player.inv>0) player.inv--;

  /* shoot */
  if(ZZ && player.shootT<=0){
    const dir=player.dir;
    const bx = dir>0 ? player.x+player.w : player.x-36;
    if(player.hasBlaster && player.ammo>0){
      if(player.weaponType==='laser'){
        bullets.push({x:bx,y:player.y+8,vx:dir*15,vy:0,life:75,type:'laser',damage:2,w:30,h:13});
        player.shootT=8;
      } else if(player.weaponType==='fire'){
        bullets.push({x:bx,y:player.y+6,vx:dir*10,vy:-0.3,life:85,type:'fire',damage:4,w:22,h:16});
        player.shootT=18;
      } else {
        [-2.2,0,2.2].forEach(vy=>bullets.push({x:bx,y:player.y+8,vx:dir*11,vy,life:70,type:'spread',damage:1,w:22,h:13}));
        player.shootT=14;
      }
      player.ammo--; SFX.shoot();
    } else {
      bullets.push({x:bx,y:player.y+7,vx:dir*11,vy:0,life:75,type:'bone',damage:1,w:36,h:14});
      player.shootT=18; SFX.shoot();
    }
  }
  if(player.shootT>0) player.shootT--;

  /* camera */
  const tx=player.x-W/3;
  camX+=(tx-camX)*0.12;
  camX=Math.max(0,Math.min(LW-W,camX));

  /* ── bullets ── */
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx; b.y+=(b.vy||0); b.life--;
    if(b.life<=0||b.x<0||b.x>LW){bullets.splice(i,1);continue;}
    // wall
    let wall=false;
    PLATS.forEach(p=>{if(overlap({x:b.x,y:b.y,w:b.w||36,h:b.h||14},p))wall=true;});
    if(wall){spawnParts(b.x+18,b.y+7,'#00ff41',5);bullets.splice(i,1);continue;}
    // hit enemy
    let rem=false;
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];
      if(e.dead) continue;
      if(overlap({x:b.x,y:b.y,w:b.w||36,h:b.h||14},e)){
        e.hp-=b.damage||1;
        spawnParts(b.x+18,b.y+7,'#00ff41',7);
        spawnParts(e.x+12,e.y+20,'#c8c8c8',6);
        SFX.hit();
        if(e.hp<=0){
          e.dead=true; e.dieT=35;
          score+=100; spawnParts(e.x+12,e.y+10,'#f1c40f',14,true);
        }
        rem=true; break;
      }
    }
    if(!rem && boss.active && !boss.dead && overlap({x:b.x,y:b.y,w:b.w||36,h:b.h||14},boss)){
      if(b.type==='bone'){
        bossMessage='PICK UP THE BLASTER!'; bossMessageT=Math.max(bossMessageT,45);
      } else {
        boss.hp-=b.damage||1; boss.inv=5;
        spawnParts(b.x,b.y,ammoColor(b.type),8,true); SFX.hit();
        if(boss.hp<=0){
          boss.hp=0;boss.dead=true;boss.active=false;score+=1500;
          bossMessage='BOSS DEFEATED!';bossMessageT=150;
          spawnParts(boss.x+boss.w/2,boss.y+boss.h/2,'#f1c40f',45,true);SFX.win();
        }
      }
      rem=true;
    }
    if(rem){bullets.splice(i,1);continue;}
  }

  /* ── enemy coins ── */
  for(let i=ecoins.length-1;i>=0;i--){
    const c=ecoins[i];
    c.x+=c.vx; c.y+=c.vy; c.vy+=0.22; c.life--;
    if(c.life<=0||c.y>H+20){ecoins.splice(i,1);continue;}
    let hp=false;
    PLATS.forEach(p=>{if(overlap({x:c.x,y:c.y,w:12,h:12},p))hp=true;});
    if(hp){ecoins.splice(i,1);continue;}
    if(!player.dead && player.inv<=0 && overlap({x:c.x,y:c.y,w:12,h:12},player)){
      SFX.coin(); hitPlayer(false); ecoins.splice(i,1);
    }
  }

  /* ── enemies ── */
  enemies.forEach(e=>{
    if(e.dead){if(e.dieT>0)e.dieT--;return;}

    if(e.type==='jelly'){
      e.phase+=0.025;
      e.x=e.baseX+Math.sin(e.phase)*40;
      e.y=e.baseY+Math.sin(e.phase*1.7)*26;
      e.dir=player.x<e.x?-1:1;
    } else {
      e.vy+=G; if(e.vy>MFALL)e.vy=MFALL;
      e.x+=e.vx; e.y+=e.vy;
      e.onGround=false;
      PLATS.forEach(p=>{if(overlap(e,p))resolveAABB(e,p);});
      if(e.onGround){
        let cliff=true;
        const cx=e.x+(e.dir>0?e.w+2:-2);
        PLATS.forEach(p=>{
          if(cx>=p.x&&cx<=p.x+p.w && e.y+e.h+4>=p.y&&e.y+e.h+4<=p.y+p.h+4) cliff=false;
        });
        if(cliff)e.dir*=-1;
      }
      if(e.x<10||e.x+e.w>LW-10)e.dir*=-1;
      e.vx=e.dir*e.speed;
    }

    if(++e.at>=12){e.at=0;e.af=1-e.af;}
    e.shootT--;
    const dx=player.x-e.x, dy=player.y-e.y;
    const dist=Math.max(1,Math.sqrt(dx*dx+dy*dy));
    if(e.shootT<=0 && dist<420 && !player.dead){
      e.shootT=(e.type==='jelly'?55:e.type==='crab'?95:70)+Math.random()*70;
      const spd=e.type==='jelly'?4.8:4+Math.random()*2;
      ecoins.push({x:e.x+e.w/2,y:e.y+e.h/2,
        vx:(dx/dist)*spd,vy:(dy/dist)*spd-(e.type==='jelly'?0:2.5),life:130,
        type:e.type==='jelly'?'bubble':e.type==='crab'?'shell':'coin'});
    }
    if(!player.dead&&player.inv<=0&&overlap(player,e)) hitPlayer(false);
  });

  /* ── trigger and update boss encounter ── */
  if(!boss.active&&!boss.dead&&player.x>BOSS_TRIGGER){
    boss.active=true;bossMessage='QUEEN BEE! FIND THE BLASTER';bossMessageT=180;SFX.boss();
    weaponDrop={x:1515,y:-35,w:38,h:24,vy:2.2,taken:false};
  }

  if(bossMessageT>0)bossMessageT--;

  if(boss.active&&!boss.dead){
    // Lock the right side of the arena until the boss is defeated.
    if(player.x+player.w>BOSS_GATE_X){player.x=BOSS_GATE_X-player.w;player.vx=Math.min(0,player.vx);}

    boss.phase+=0.03;
    boss.x=1700+Math.sin(boss.phase)*165;
    boss.y=95+Math.sin(boss.phase*1.55)*58;
    if(boss.inv>0)boss.inv--;

    boss.shootT--;
    if(boss.shootT<=0&&!player.dead){
      boss.shootT=38+Math.random()*30;
      const dx=player.x-boss.x,dy=player.y-boss.y;
      const d=Math.max(1,Math.sqrt(dx*dx+dy*dy));
      const type=Math.random()<0.35?'honey':'stinger';
      const spd=type==='honey'?4.3:6.2;
      bossShots.push({x:boss.x+10,y:boss.y+30,vx:dx/d*spd,vy:dy/d*spd,
                      type,life:150,w:type==='honey'?13:20,h:type==='honey'?13:10});
    }

    boss.dropT--;
    if(boss.dropT<=0){
      boss.dropT=150+Math.random()*80;
      const types=['laser','fire','spread'];
      const type=types[Math.floor(Math.random()*types.length)];
      ammoDrops.push({x:1480+Math.random()*390,y:-25,w:28,h:20,vy:1.7+Math.random(),type,life:700});
    }

    if(!player.dead&&player.inv<=0&&overlap(player,boss))hitPlayer(false);
  }

  /* weapon falling into the arena */
  if(weaponDrop&&!weaponDrop.taken){
    weaponDrop.y+=weaponDrop.vy;
    if(weaponDrop.y>420){weaponDrop.y=420;weaponDrop.vy=0;}
    if(overlap(player,weaponDrop)){
      weaponDrop.taken=true;player.hasBlaster=true;player.weaponType='laser';player.ammo=14;
      bossMessage='BLASTER ACQUIRED — PRESS Z';bossMessageT=120;SFX.power();score+=250;
    }
  }

  /* falling ammunition */
  for(let i=ammoDrops.length-1;i>=0;i--){
    const a=ammoDrops[i];a.y+=a.vy;a.life--;
    if(a.y>424){a.y=424;a.vy=0;}
    if(a.life<=0){ammoDrops.splice(i,1);continue;}
    if(overlap(player,a)){
      player.hasBlaster=true;player.weaponType=a.type;
      player.ammo=a.type==='laser'?16:a.type==='fire'?8:12;
      bossMessage=ammoLabel(a.type)+' AMMO!';bossMessageT=65;SFX.power();
      ammoDrops.splice(i,1);
    }
  }

  /* boss projectiles */
  for(let i=bossShots.length-1;i>=0;i--){
    const b=bossShots[i];b.x+=b.vx;b.y+=b.vy;
    if(b.type==='honey')b.vy+=0.08;
    b.life--;
    if(b.life<=0||b.x<0||b.x>LW||b.y>H+30){bossShots.splice(i,1);continue;}
    let wall=false;PLATS.forEach(p=>{if(overlap({x:b.x,y:b.y,w:b.w,h:b.h},p))wall=true;});
    if(wall){bossShots.splice(i,1);continue;}
    if(!player.dead&&player.inv<=0&&overlap({x:b.x,y:b.y,w:b.w,h:b.h},player)){
      hitPlayer(false);bossShots.splice(i,1);
    }
  }

  /* goal */
  if(overlap(player,GOAL)&&boss.dead){GS='win';score+=1000;SFX.win();}
}

function hitPlayer(fell) {
  if(player.dead||player.inv>0) return;
  lives--;
  SFX.die();
  spawnParts(player.x+14,player.y+16,'#b87333',12,true);
  if(fell||lives<=0){
    player.dead=true; player.dieT=55; player.vy=-8;
    if(lives<=0) setTimeout(()=>{if(lives<=0)GS='over';},900);
  } else {
    player.inv=150;
  }
}

/* ─────────────────────────────────────────────────────────── *
 *  DRAW                                                       *
 * ─────────────────────────────────────────────────────────── */
function draw() {
  ctx.clearRect(0,0,W,H);
  drawBG();

  /* bubbles */
  bubbles.forEach(b=>{
    const bx=(b.wx-camX+LW)%LW;
    if(bx<-20||bx>W+20) return;
    ctx.save();
    ctx.globalAlpha=b.al;
    ctx.strokeStyle='#5ab4e0'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(bx,b.y,b.r,0,Math.PI*2); ctx.stroke();
    ctx.globalAlpha=b.al*0.25; ctx.fillStyle='#8cd6f0'; ctx.fill();
    ctx.restore();
  });

  drawGoal();
  PLATS.forEach(drawPlat);

  /* dead enemies fading */
  enemies.forEach(e=>{
    if(!e.dead||e.dieT<=0) return;
    ctx.save(); ctx.globalAlpha=e.dieT/35;
    ctx.translate(Math.floor(e.x-camX),Math.floor(e.y));
    if(e.dir<0){ctx.translate(12,0);ctx.scale(-1,1);}
    if(e.type==='crab')crabSprite(e.af,e.hp,e.maxHp);
    else if(e.type==='jelly')jellySprite(e.af,e.hp,e.maxHp);
    else skelSprite(e.af,e.hp,e.maxHp);
    ctx.restore();
  });

  /* live enemies */
  enemies.forEach(e=>{
    if(e.dead) return;
    ctx.save();
    ctx.translate(Math.floor(e.x-camX),Math.floor(e.y));
    if(e.dir<0){ctx.translate(e.w/2,0);ctx.scale(-1,1);ctx.translate(-e.w/2,0);}
    if(e.type==='crab')crabSprite(e.af,e.hp,e.maxHp);
    else if(e.type==='jelly')jellySprite(e.af,e.hp,e.maxHp);
    else skelSprite(e.af,e.hp,e.maxHp);
    ctx.restore();
  });

  /* boss arena gate */
  if(boss.active&&!boss.dead){
    const gx=BOSS_GATE_X-camX;
    if(gx>-20&&gx<W+20){
      ctx.save();ctx.globalAlpha=.65;ctx.fillStyle='#00e5ff';
      for(let y=48;y<H;y+=24)ctx.fillRect(gx,y,5,14);
      ctx.restore();
    }
  }

  /* boss, weapon and ammo */
  if(boss.active&&!boss.dead){
    ctx.save();ctx.translate(Math.floor(boss.x-camX),Math.floor(boss.y));
    if(boss.inv>0&&boss.inv%2===0)ctx.globalAlpha=.35;
    beeBossSprite();ctx.restore();
  }
  if(weaponDrop&&!weaponDrop.taken)drawWeaponDrop(weaponDrop);
  ammoDrops.forEach(drawAmmoDrop);
  bossShots.forEach(drawBossShot);

  /* coins */
  ecoins.forEach(drawECoin);
  /* player bullets */
  bullets.forEach(drawBullet);

  /* player */
  if(!player.dead){
    ctx.save();
    ctx.translate(Math.floor(player.x-camX),Math.floor(player.y));
    if(player.dir<0){ctx.translate(14,0);ctx.scale(-1,1);}
    dogSprite(player.gliding,player.af,player.inv); ctx.restore();
  }

  /* particles */
  parts.forEach(p=>{
    ctx.save(); ctx.globalAlpha=p.life/p.max;
    ctx.fillStyle=p.col;
    ctx.fillRect(Math.floor(p.x-camX),Math.floor(p.y),p.r,p.r);
    ctx.restore();
  });

  drawHUD();

  if(bossMessageT>0){
    ctx.save();
    const alpha=Math.min(1,bossMessageT/30);
    ctx.globalAlpha=alpha;ctx.fillStyle='rgba(0,0,0,.62)';ctx.fillRect(150,82,500,46);
    ctx.strokeStyle='#f1c40f';ctx.strokeRect(150,82,500,46);
    ctx.fillStyle='#fff';ctx.font='bold 18px monospace';ctx.textAlign='center';
    ctx.fillText(bossMessage,W/2,111);ctx.restore();ctx.textAlign='left';
  }

  /* overlays */
  if(GS==='over'||GS==='win'){
    ctx.fillStyle='rgba(0,0,10,0.78)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    if(GS==='over'){
      ctx.fillStyle='#e74c3c'; ctx.font='bold 52px monospace';
      ctx.fillText('GAME OVER',W/2,195);
      ctx.fillStyle='#fff';  ctx.font='24px monospace';
      ctx.fillText('Score: '+score,W/2,258);
      ctx.fillStyle='#f1c40f'; ctx.font='20px monospace';
      ctx.fillText('Press  R  to restart',W/2,318);
    } else {
      ctx.fillStyle='#2ecc40'; ctx.font='bold 52px monospace';
      ctx.fillText('YOU WIN!',W/2,185);
      ctx.fillStyle='#f1c40f'; ctx.font='28px monospace';
      ctx.fillText('Score: '+score,W/2,255);
      ctx.fillStyle='#7ec8e3'; ctx.font='20px monospace';
      ctx.fillText('Lives left: '+lives,W/2,305);
      ctx.fillStyle='#aaa';
      ctx.fillText('Press  R  to play again',W/2,360);
    }
    ctx.textAlign='left';
  }
}

/* ─── Loop ───────────────────────────────────────────────── */
function loop(){
  update(); draw();
  requestAnimationFrame(loop);
}

resetGame();
loop();
</script>
