<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dog Deep Sea</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; justify-content: center; align-items: center;
         height: 100vh; overflow: hidden; font-family: monospace; }
  canvas { display: block; image-rendering: pixelated; border: 2px solid #0d2a4a;
           max-width: 100vw; max-height: 100vh; width: auto; height: auto; }
</style>

<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width  = 800;
canvas.height = 500;

/* ─── Audio ─────────────────────────────────────────────── */
const AC = new (window.AudioContext || window.webkitAudioContext)();
function beep(freq, freq2, dur, type='sine', vol=0.25) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.connect(g); g.connect(AC.destination);
  o.frequency.setValueAtTime(freq, AC.currentTime);
  if(freq2) o.frequency.exponentialRampToValueAtTime(freq2, AC.currentTime + dur);
  g.gain.setValueAtTime(vol, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
  o.start(); o.stop(AC.currentTime + dur);
}
const SFX = {
  jump:  () => beep(280, 560, 0.18, 'sine', 0.3),
  shoot: () => beep(900, 220, 0.14, 'square', 0.18),
  hit:   () => beep(250, 80,  0.22, 'sawtooth', 0.3),
  die:   () => beep(440, 55,  0.55, 'sawtooth', 0.35),
  coin:  () => beep(550, 800, 0.12, 'sine', 0.2),
  win:   () => { beep(523,523,0.1); setTimeout(()=>beep(659,659,0.1),120);
                 setTimeout(()=>beep(784,784,0.1),240); setTimeout(()=>beep(1047,1047,0.25),360); }
};

/* ─── Input ─────────────────────────────────────────────── */
const K = {};
document.addEventListener('keydown', e => {
  K[e.code] = true;
  if(e.code==='Space') e.preventDefault();
  if(AC.state==='suspended') AC.resume();
  if(e.code==='KeyR' && (GS==='over'||GS==='win')) resetGame();
});
document.addEventListener('keyup',   e => { K[e.code] = false; });

/* ─── Constants ──────────────────────────────────────────── */
const W  = 800, H = 500;
const LW = 3200;          // level width
const G  = 0.52, MFALL = 13;

/* ─── Game state ─────────────────────────────────────────── */
let GS, score, lives, camX, frame;
let spaceWasUp;           // for jump edge detection

/* ─── Platforms (coral) ──────────────────────────────────── */
const PLATS = [
  // ground chunks
  {x:0,   y:460, w:380, h:40},
  {x:430, y:460, w:320, h:40},
  {x:800, y:460, w:380, h:40},
  {x:1230,y:460, w:350, h:40},
  {x:1630,y:460, w:380, h:40},
  {x:2060,y:460, w:340, h:40},
  {x:2450,y:460, w:380, h:40},
  {x:2880,y:460, w:320, h:40},
  // mid platforms
  {x:200, y:360, w:110, h:18},
  {x:380, y:295, w:120, h:18},
  {x:560, y:360, w:100, h:18},
  {x:700, y:278, w:130, h:18},
  {x:890, y:338, w:120, h:18},
  {x:1060,y:258, w:110, h:18},
  {x:1210,y:338, w:130, h:18},
  {x:1390,y:265, w:120, h:18},
  {x:1560,y:355, w:110, h:18},
  {x:1720,y:285, w:130, h:18},
  {x:1890,y:368, w:115, h:18},
  {x:2060,y:275, w:140, h:18},
  {x:2230,y:358, w:120, h:18},
  {x:2390,y:258, w:130, h:18},
  {x:2560,y:338, w:120, h:18},
  {x:2700,y:265, w:145, h:18},
  {x:2910,y:358, w:125, h:18},
  // high platforms
  {x:450, y:218, w:110, h:18},
  {x:800, y:198, w:130, h:18},
  {x:1110,y:178, w:110, h:18},
  {x:1500,y:188, w:125, h:18},
  {x:1910,y:198, w:115, h:18},
  {x:2310,y:178, w:135, h:18},
  {x:2660,y:198, w:125, h:18},
  // end platform
  {x:3050,y:348, w:150, h:20},
];

/* ─── Enemy template ─────────────────────────────────────── */
function mkEnemy(x,y,hp=2) {
  return {x,y,w:24,h:40, vx:-1,vy:0, dir:-1, hp, maxHp:hp,
          onGround:false, shootT:90+Math.random()*80,
          dead:false, dieT:0, af:0, at:0};
}
let ENEMIES_INIT = [
  mkEnemy(500,418),  mkEnemy(820,418),  mkEnemy(1100,418),
  mkEnemy(1400,418), mkEnemy(1700,418), mkEnemy(2100,418),
  mkEnemy(2250,418), mkEnemy(2520,418), mkEnemy(2820,418),
  mkEnemy(560,318),  mkEnemy(900,298),  mkEnemy(1070,215),
  mkEnemy(1395,222), mkEnemy(1510,145), mkEnemy(1720,242),
  mkEnemy(2065,232), mkEnemy(2315,135), mkEnemy(2665,155),
  mkEnemy(3055,305,3),  // mini boss
];

let enemies, bullets, ecoins, parts, bubbles, player;

/* ─── Bubbles ────────────────────────────────────────────── */
function initBubbles() {
  bubbles = [];
  for(let i=0;i<40;i++) bubbles.push({
    wx: Math.random()*LW,
    y:  Math.random()*H,
    r:  2+Math.random()*5,
    sp: 0.3+Math.random()*0.7,
    al: 0.15+Math.random()*0.35
  });
}

/* ─── Goal ───────────────────────────────────────────────── */
const GOAL = {x:3140, y:265, w:28, h:85};

/* ─── AABB helpers ───────────────────────────────────────── */
function overlap(a,b){
  return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;
}
function resolveAABB(obj, p) {
  const ox = Math.min(obj.x+obj.w,p.x+p.w)-Math.max(obj.x,p.x);
  const oy = Math.min(obj.y+obj.h,p.y+p.h)-Math.max(obj.y,p.y);
  if(ox<oy) {
    obj.vx=0;
    obj.x = obj.x<p.x ? p.x-obj.w : p.x+p.w;
  } else {
    if(obj.y<p.y){ obj.y=p.y-obj.h; obj.vy=0; obj.onGround=true; }
    else          { obj.y=p.y+p.h;  obj.vy=0; }
  }
}

/* ─── Particles ──────────────────────────────────────────── */
function spawnParts(x,y,col,n,strong=false) {
  for(let i=0;i<n;i++) parts.push({
    x,y,
    vx:(Math.random()-0.5)*(strong?8:5),
    vy:-Math.random()*(strong?7:4)-1,
    life:35+Math.random()*25, max:60,
    col, r:2+Math.random()*3
  });
}

/* ─── Reset ──────────────────────────────────────────────── */
function resetGame() {
  GS='play'; score=0; lives=3; camX=0; frame=0; spaceWasUp=true;
  player = {
    x:80,y:300,w:28,h:32,vx:0,vy:0,
    onGround:false, gliding:false, dir:1,
    shootT:0, inv:0, dead:false, dieT:0,
    af:0, at:0, jumpHeld:false
  };
  enemies = ENEMIES_INIT.map(e=>({...e}));
  bullets=[]; ecoins=[]; parts=[];
  initBubbles();
}

/* ─────────────────────────────────────────────────────────── *
 *  PIXEL-ART DRAWING                                          *
 * ─────────────────────────────────────────────────────────── */

/* Draw pixel-art dog at (0,0), facing right */
function dogSprite(gliding, af, inv) {
  if(inv>0 && (inv%6)<3) return; // invincibility flash

  // tail
  ctx.fillStyle='#8b5a2b';
  ctx.fillRect(-7,15,7,5);
  ctx.fillRect(-11,11,5,5);

  // body
  ctx.fillStyle='#b87333';
  ctx.fillRect(3,10,21,18);

  // chest / belly
  ctx.fillStyle='#e8c08d';
  ctx.fillRect(6,14,10,12);

  // cape while gliding (keeps the original glide mechanic visible)
  if(gliding) {
    ctx.fillStyle='#d62828';
    ctx.fillRect(-5,10,9,4);
    ctx.fillRect(-9,14,13,4);
    ctx.fillRect(-12,18,16,4);
  }

  // head
  ctx.fillStyle='#b87333';
  ctx.fillRect(7,0,16,14);

  // floppy ear
  ctx.fillStyle='#6f451f';
  ctx.fillRect(5,1,5,11);
  ctx.fillRect(3,7,5,7);

  // muzzle
  ctx.fillStyle='#e8c08d';
  ctx.fillRect(18,6,10,7);

  // nose
  ctx.fillStyle='#1f1f1f';
  ctx.fillRect(25,7,4,4);

  // eye
  ctx.fillStyle='#ffffff';
  ctx.fillRect(15,3,5,5);
  ctx.fillStyle='#111111';
  ctx.fillRect(17,4,2,3);

  // collar
  ctx.fillStyle='#2471a3';
  ctx.fillRect(6,12,18,3);
  ctx.fillStyle='#f4d03f';
  ctx.fillRect(14,14,4,4);

  // animated legs
  ctx.fillStyle='#8b5a2b';
  if(af===0){
    ctx.fillRect(5,27,6,8); ctx.fillRect(17,27,6,8);
    ctx.fillRect(3,33,9,4); ctx.fillRect(16,33,9,4);
  } else {
    ctx.fillRect(5,27,6,10); ctx.fillRect(17,27,6,6);
    ctx.fillRect(3,35,9,4); ctx.fillRect(16,31,9,4);
  }
}

/* Draw pirate skeleton at (0,0), facing right */
function skelSprite(af, hp, maxHp) {
  const dmg = hp < maxHp;
  const bc = dmg ? '#ffb0a0' : '#c8c8c8';
  const dk = dmg ? '#e06050' : '#999';
  // pirate hat
  ctx.fillStyle='#1a1a2e'; ctx.fillRect(1,0,22,5); ctx.fillRect(5,-7,14,9);
  // skull & crossbones on hat
  ctx.fillStyle='#fff';
  ctx.fillRect(8,-6,8,6);
  ctx.fillStyle='#000'; ctx.fillRect(9,-5,2,2); ctx.fillRect(13,-5,2,2);
  // crossbones
  ctx.fillStyle='#fff';
  ctx.fillRect(6,-2,12,2);
  ctx.fillRect(11,-5,2,6);
  // skull head
  ctx.fillStyle=bc; ctx.fillRect(3,5,18,15);
  // eye sockets
  ctx.fillStyle='#000'; ctx.fillRect(5,8,5,5); ctx.fillRect(14,8,5,5);
  // glowing eyes
  ctx.fillStyle='#ff3333'; ctx.fillRect(6,9,3,3); ctx.fillRect(15,9,3,3);
  // teeth
  ctx.fillStyle=bc; ctx.fillRect(5,18,14,4);
  ctx.fillStyle='#000'; ctx.fillRect(8,18,2,4); ctx.fillRect(12,18,2,4);
  // body
  ctx.fillStyle=bc; ctx.fillRect(5,22,14,14);
  // ribs
  ctx.fillStyle=dk;
  ctx.fillRect(6,24,12,2); ctx.fillRect(6,28,12,2); ctx.fillRect(6,32,12,2);
  // sword arm (right)
  ctx.fillStyle=bc; ctx.fillRect(19,22,4,12);
  ctx.fillStyle='#888'; ctx.fillRect(21,18,3,18);
  ctx.fillStyle='#aaa'; ctx.fillRect(17,24,10,3);
  ctx.fillStyle='#c8a000'; ctx.fillRect(21,34,3,3);
  // left arm
  ctx.fillStyle=bc; ctx.fillRect(1,22,4,12);
  // legs animated
  ctx.fillStyle=bc;
  if(af===0){
    ctx.fillRect(6,36,5,10); ctx.fillRect(13,36,5,10);
    ctx.fillRect(4,44,8,3);  ctx.fillRect(12,44,8,3);
  } else {
    ctx.fillRect(6,36,5,12); ctx.fillRect(13,36,5,8);
    ctx.fillRect(4,46,8,3);  ctx.fillRect(12,42,8,3);
  }
}

/* Draw single coral platform */
function drawPlat(p) {
  const px = p.x-camX, py = p.y;
  if(px+p.w<0||px>W) return;
  // base
  ctx.fillStyle='#a93226'; ctx.fillRect(px,py,p.w,p.h);
  ctx.fillStyle='#c0392b'; ctx.fillRect(px,py,p.w,p.h>20?4:3);
  // texture stripes
  ctx.fillStyle='#e74c3c';
  for(let i=0;i<p.w;i+=18){ctx.fillRect(px+i,py,9,3);}
  // top bumps/spikes
  if(p.h>=40) {
    ctx.fillStyle='#e74c3c';
    for(let i=10;i<p.w-10;i+=22){
      ctx.fillRect(px+i,py-9,13,12); ctx.fillRect(px+i+3,py-15,7,9);
      ctx.fillRect(px+i+5,py-19,4,6);
    }
    ctx.fillStyle='#7b241c'; ctx.fillRect(px,py+p.h-7,p.w,7);
  } else {
    ctx.fillStyle='#e74c3c';
    for(let i=5;i<p.w-5;i+=16){
      ctx.fillRect(px+i,py-7,7,9); ctx.fillRect(px+i+2,py-12,4,7);
    }
  }
  ctx.fillStyle='#f15a4a'; ctx.fillRect(px,py,p.w,2);
}

/* Draw bone projectile */
function drawBullet(b) {
  const bx = b.x-camX, by = b.y;
  ctx.fillStyle='#f5f1df';
  ctx.fillRect(bx+7,by+4,22,6);
  ctx.fillRect(bx+3,by+2,7,5);
  ctx.fillRect(bx+3,by+7,7,5);
  ctx.fillRect(bx+27,by+2,7,5);
  ctx.fillRect(bx+27,by+7,7,5);
  ctx.fillStyle='#d8d1b7';
  ctx.fillRect(bx+9,by+6,18,2);
}

/* Draw coin projectile */
function drawECoin(c) {
  const cx=c.x-camX, cy=c.y;
  ctx.fillStyle='#f1c40f'; ctx.fillRect(cx,cy,10,10);
  ctx.fillStyle='#d4ac0d'; ctx.fillRect(cx+2,cy+1,6,8);
  ctx.fillStyle='#f7dc6f'; ctx.fillRect(cx+3,cy+2,3,3);
}

/* Draw goal flag */
function drawGoal() {
  const gx=GOAL.x-camX, gy=GOAL.y;
  if(gx<-60||gx>W+60) return;
  ctx.fillStyle='#aaa'; ctx.fillRect(gx+12,gy-22,4,GOAL.h+22);
  ctx.fillStyle='#e74c3c'; ctx.fillRect(gx+16,gy-22,32,22);
  ctx.fillStyle='#fff'; ctx.font='bold 8px monospace'; ctx.textAlign='left';
  ctx.fillText('WIN!',gx+19,gy-8);
  ctx.fillStyle='#888'; ctx.fillRect(gx+4,gy+GOAL.h,24,8);
}

/* Draw ocean background */
function drawBG() {
  // sky→deep gradient
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#06082a'); g.addColorStop(0.55,'#0b1e55');
  g.addColorStop(1,'#071e0e');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // light rays
  ctx.save(); ctx.globalAlpha=0.04; ctx.fillStyle='#3a80d0';
  for(let i=0;i<6;i++){
    const rx=((i*170+frame*0.15)%900)-100;
    ctx.beginPath();
    ctx.moveTo(rx,0); ctx.lineTo(rx+80,H); ctx.lineTo(rx-30,H);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  // far seaweed silhouettes
  ctx.fillStyle='#0b2e38';
  for(let i=0;i<22;i++){
    const bx=((i*165-camX*0.18)%W+W)%W;
    const bh=38+(i%5)*18;
    ctx.fillRect(bx,H-bh,10,bh); ctx.fillRect(bx+3,H-bh-12,5,14);
  }
}

/* Draw HUD */
function drawHUD() {
  ctx.fillStyle='rgba(0,0,10,0.65)'; ctx.fillRect(0,0,W,36);
  ctx.fillStyle='#2ecc40'; ctx.font='bold 15px monospace';
  ctx.textAlign='left';
  ctx.fillText('❤ '+lives, 10, 23);
  ctx.fillStyle='#f1c40f';
  ctx.fillText('SCORE '+score, 120, 23);
  ctx.fillStyle='#e74c3c';
  ctx.fillText('SKELETONS '+enemies.filter(e=>!e.dead).length, 360, 23);
  ctx.fillStyle='#557';
  ctx.font='10px monospace';
  ctx.textAlign='right';
  ctx.fillText('WASD/ARROWS  SPACE=jump/glide  Z=shoot  R=restart', W-6, 23);
}

/* ─────────────────────────────────────────────────────────── *
 *  UPDATE                                                     *
 * ─────────────────────────────────────────────────────────── */
function update() {
  if(GS!=='play') return;
  frame++;

  /* bubbles */
  bubbles.forEach(b=>{
    b.y-=b.sp;
    if(b.y+b.r<0){ b.y=H+b.r; b.wx=Math.random()*LW; }
  });

  /* particles */
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.18; p.life--;
    if(p.life<=0) parts.splice(i,1);
  }

  /* player dead animation */
  if(player.dead){
    player.vy+=G; player.y+=player.vy; player.dieT--;
    if(player.dieT<=0){
      if(lives<=0){ GS='over'; return; }
      player.x=Math.max(camX+60,80); player.y=80;
      player.vx=0; player.vy=0; player.dead=false;
      player.inv=160; player.gliding=false;
    }
    return;
  }

  /* ── player input ── */
  const L=K['KeyA']||K['ArrowLeft'];
  const R=K['KeyD']||K['ArrowRight'];
  const SP=K['Space'];
  const ZZ=K['KeyZ'];

  if(L){ player.vx-=0.85; player.dir=-1; }
  if(R){ player.vx+=0.85; player.dir= 1; }
  if(!L&&!R) player.vx*=0.78;
  player.vx=Math.max(-6.5,Math.min(6.5,player.vx));

  /* jump - only on fresh press */
  if(SP && player.onGround && spaceWasUp){
    player.vy=-11.5; player.onGround=false;
    player.jumpHeld=true; spaceWasUp=false;
    SFX.jump();
  }
  if(!SP) spaceWasUp=true;

  /* glide - hold space while falling */
  player.gliding = SP && !player.onGround && player.vy>1;
  if(player.gliding) player.vy=Math.min(player.vy, 1.4);

  /* gravity */
  if(!player.gliding) player.vy+=G;
  if(player.vy>MFALL) player.vy=MFALL;

  player.x+=player.vx; player.y+=player.vy;
  if(player.x<0){player.x=0; player.vx=0;}
  if(player.x+player.w>LW){player.x=LW-player.w; player.vx=0;}

  /* platform collision */
  player.onGround=false;
  PLATS.forEach(p=>{ if(overlap(player,p)) resolveAABB(player,p); });

  /* fall kill */
  if(player.y>H+60) hitPlayer(true);

  /* animate */
  if(++player.at>=10){ player.at=0; player.af=1-player.af; }
  if(player.inv>0) player.inv--;

  /* shoot */
  if(ZZ && player.shootT<=0){
    const bx = player.dir>0 ? player.x+player.w : player.x-36;
    bullets.push({x:bx, y:player.y+7, vx:player.dir*11, life:75});
    player.shootT=18; SFX.shoot();
  }
  if(player.shootT>0) player.shootT--;

  /* camera */
  const tx=player.x-W/3;
  camX+=(tx-camX)*0.12;
  camX=Math.max(0,Math.min(LW-W,camX));

  /* ── bullets ── */
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx; b.life--;
    if(b.life<=0||b.x<0||b.x>LW){bullets.splice(i,1);continue;}
    // wall
    let wall=false;
    PLATS.forEach(p=>{if(overlap({x:b.x,y:b.y,w:36,h:14},p))wall=true;});
    if(wall){spawnParts(b.x+18,b.y+7,'#00ff41',5);bullets.splice(i,1);continue;}
    // hit enemy
    let rem=false;
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];
      if(e.dead) continue;
      if(overlap({x:b.x,y:b.y,w:36,h:14},e)){
        e.hp--;
        spawnParts(b.x+18,b.y+7,'#00ff41',7);
        spawnParts(e.x+12,e.y+20,'#c8c8c8',6);
        SFX.hit();
        if(e.hp<=0){
          e.dead=true; e.dieT=35;
          score+=100; spawnParts(e.x+12,e.y+10,'#f1c40f',14,true);
        }
        rem=true; break;
      }
    }
    if(rem){bullets.splice(i,1);continue;}
  }

  /* ── enemy coins ── */
  for(let i=ecoins.length-1;i>=0;i--){
    const c=ecoins[i];
    c.x+=c.vx; c.y+=c.vy; c.vy+=0.22; c.life--;
    if(c.life<=0||c.y>H+20){ecoins.splice(i,1);continue;}
    let hp=false;
    PLATS.forEach(p=>{if(overlap({x:c.x,y:c.y,w:10,h:10},p))hp=true;});
    if(hp){ecoins.splice(i,1);continue;}
    if(!player.dead && player.inv<=0 && overlap({x:c.x,y:c.y,w:10,h:10},player)){
      SFX.coin(); hitPlayer(false); ecoins.splice(i,1);
    }
  }

  /* ── enemies ── */
  enemies.forEach(e=>{
    if(e.dead){if(e.dieT>0)e.dieT--;return;}
    e.vy+=G; if(e.vy>MFALL)e.vy=MFALL;
    e.x+=e.vx; e.y+=e.vy;
    e.onGround=false;
    PLATS.forEach(p=>{if(overlap(e,p))resolveAABB(e,p);});
    // reverse at wall or cliff
    if(e.onGround){
      let cliff=true;
      const cx=e.x+(e.dir>0?e.w+2:-2);
      PLATS.forEach(p=>{
        if(cx>=p.x&&cx<=p.x+p.w && e.y+e.h+4>=p.y&&e.y+e.h+4<=p.y+p.h+4) cliff=false;
      });
      if(cliff){e.dir*=-1;e.vx=e.dir*1.2;}
    }
    if(e.x<10||e.x+e.w>LW-10){e.dir*=-1;e.vx=e.dir*1.2;}
    e.vx=e.dir*1.2;
    // animate
    if(++e.at>=12){e.at=0;e.af=1-e.af;}
    // shoot coin
    e.shootT--;
    const dx=player.x-e.x, dy=player.y-e.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(e.shootT<=0 && dist<420 && !player.dead){
      e.shootT=70+Math.random()*70;
      const spd=4+Math.random()*2;
      ecoins.push({x:e.x+12,y:e.y+20,vx:(dx/dist)*spd,vy:(dy/dist)*spd-2.5,life:130});
    }
    // touch player
    if(!player.dead&&player.inv<=0&&overlap(player,e)) hitPlayer(false);
  });

  /* goal */
  if(overlap(player,GOAL)){GS='win';score+=1000;SFX.win();}
}

function hitPlayer(fell) {
  if(player.dead||player.inv>0) return;
  lives--;
  SFX.die();
  spawnParts(player.x+14,player.y+16,'#b87333',12,true);
  if(fell||lives<=0){
    player.dead=true; player.dieT=55; player.vy=-8;
    if(lives<=0) setTimeout(()=>{if(lives<=0)GS='over';},900);
  } else {
    player.inv=150;
  }
}

/* ─────────────────────────────────────────────────────────── *
 *  DRAW                                                       *
 * ─────────────────────────────────────────────────────────── */
function draw() {
  ctx.clearRect(0,0,W,H);
  drawBG();

  /* bubbles */
  bubbles.forEach(b=>{
    const bx=(b.wx-camX+LW)%LW;
    if(bx<-20||bx>W+20) return;
    ctx.save();
    ctx.globalAlpha=b.al;
    ctx.strokeStyle='#5ab4e0'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(bx,b.y,b.r,0,Math.PI*2); ctx.stroke();
    ctx.globalAlpha=b.al*0.25; ctx.fillStyle='#8cd6f0'; ctx.fill();
    ctx.restore();
  });

  drawGoal();
  PLATS.forEach(drawPlat);

  /* dead enemies fading */
  enemies.forEach(e=>{
    if(!e.dead||e.dieT<=0) return;
    ctx.save(); ctx.globalAlpha=e.dieT/35;
    ctx.translate(Math.floor(e.x-camX),Math.floor(e.y));
    if(e.dir<0){ctx.translate(12,0);ctx.scale(-1,1);}
    skelSprite(e.af,e.hp,e.maxHp); ctx.restore();
  });

  /* live enemies */
  enemies.forEach(e=>{
    if(e.dead) return;
    ctx.save();
    ctx.translate(Math.floor(e.x-camX),Math.floor(e.y));
    if(e.dir<0){ctx.translate(12,0);ctx.scale(-1,1);}
    skelSprite(e.af,e.hp,e.maxHp); ctx.restore();
  });

  /* coins */
  ecoins.forEach(drawECoin);
  /* player bullets */
  bullets.forEach(drawBullet);

  /* player */
  if(!player.dead){
    ctx.save();
    ctx.translate(Math.floor(player.x-camX),Math.floor(player.y));
    if(player.dir<0){ctx.translate(14,0);ctx.scale(-1,1);}
    dogSprite(player.gliding,player.af,player.inv); ctx.restore();
  }

  /* particles */
  parts.forEach(p=>{
    ctx.save(); ctx.globalAlpha=p.life/p.max;
    ctx.fillStyle=p.col;
    ctx.fillRect(Math.floor(p.x-camX),Math.floor(p.y),p.r,p.r);
    ctx.restore();
  });

  drawHUD();

  /* overlays */
  if(GS==='over'||GS==='win'){
    ctx.fillStyle='rgba(0,0,10,0.78)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    if(GS==='over'){
      ctx.fillStyle='#e74c3c'; ctx.font='bold 52px monospace';
      ctx.fillText('GAME OVER',W/2,195);
      ctx.fillStyle='#fff';  ctx.font='24px monospace';
      ctx.fillText('Score: '+score,W/2,258);
      ctx.fillStyle='#f1c40f'; ctx.font='20px monospace';
      ctx.fillText('Press  R  to restart',W/2,318);
    } else {
      ctx.fillStyle='#2ecc40'; ctx.font='bold 52px monospace';
      ctx.fillText('YOU WIN!',W/2,185);
      ctx.fillStyle='#f1c40f'; ctx.font='28px monospace';
      ctx.fillText('Score: '+score,W/2,255);
      ctx.fillStyle='#7ec8e3'; ctx.font='20px monospace';
      ctx.fillText('Lives left: '+lives,W/2,305);
      ctx.fillStyle='#aaa';
      ctx.fillText('Press  R  to play again',W/2,360);
    }
    ctx.textAlign='left';
  }
}

/* ─── Loop ───────────────────────────────────────────────── */
function loop(){
  update(); draw();
  requestAnimationFrame(loop);
}

resetGame();
loop();
</script>
